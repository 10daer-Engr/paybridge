server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  tomcat:
    threads:
      max: 20
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: paybridge

  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:paybridge}
    username: ${POSTGRES_USER:paybridge}
    password: ${POSTGRES_PASSWORD:422002Kamsi!}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      max-lifetime: 240000      # recycle connections before a serverless DB's idle suspend can strand them
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

paystack:
  base-url: https://api.paystack.co
  secret-key: ${PAYSTACK_SECRET_KEY:}
  connect-timeout: 3s
  read-timeout: 10s

paybridge:
  sandbox:
    funding-enabled: true
    settlement-payments-enabled: true
    partner-registration-enabled: true
  partners:
    default-credit-limit-usd: 10000.00
  rate-limit:
    enabled: true
  transfers:
    provider-grace: 2m
    reconcile-enabled: true
    reconcile-interval: PT1M
    reconcile-min-age: PT30S
    stuck-alert-after: PT1H
  fx:
    spread-bps: 150
    fee-usd: "1.00"
    quote-ttl: PT2M
    min-send-usd: "5.00"
    max-send-usd: "2000.00"
    simulated-base-rate: "1500.00"
  compliance:
    sender-daily-limit-usd: "3000.00"
    recipient-daily-limit-usd: "5000.00"
    partner-daily-limit-usd: "50000.00"
    match-threshold: 0.85
    blocked-names:
      - Ivan Sanctionov
      - Acme Blocked Trading
    blocked-countries:
      - KP
  settlement:
    min-age: PT0S
  provider:
    mode: paystack               # "simulated" uses the built-in payout provider (see README)
    simulated-pending-seconds: 30